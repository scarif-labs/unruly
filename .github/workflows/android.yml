name: Android Build

on:
  push:
    branches: [shellac]
  pull_request:
    branches: [shellac]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install ninja-build
        run: sudo apt-get install -y ninja-build
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply vendored submodule patches
        run: (cd media && git apply ../patches/media-consumer-proguard-agp9.patch)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "jetbrains"
          cache: gradle
      - name: Install pinned NDK
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358"
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build debug APK with Gradle
        run: ./gradlew assembleDebug
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shellac_Debug
          path: ./app/build/outputs/apk/debug/app-debug.apk
