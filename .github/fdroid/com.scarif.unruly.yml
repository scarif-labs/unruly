AutoName: Unruly

RepoType: git
Repo: https://github.com/scarif-labs/unruly.git
Binaries: https://github.com/scarif-labs/unruly/releases/download/v%v/unruly-%v.apk

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: 3e056506b5b669e464d07069b51b2d0f2e928ba1
    subdir: app
    submodules: true
    sudo:
      - echo "deb https://deb.debian.org/debian trixie main" > /etc/apt/sources.list.d/trixie.list
      - apt-get update
      - apt-get install -y -t trixie openjdk-21-jdk-headless
      - update-alternatives --auto java
      - apt-get install -y cmake file make ninja-build
    gradle:
      - yes
    prebuild:
      - sed -i -e '/afterEvaluate {/,/^}/d' ../media/publish.gradle
      - sed -i -e '/gms/d' ../media/build.gradle
      - sed -i -e '/foojay/d' ../settings.gradle
      - cd ../media && git apply ../patches/media-consumer-proguard-agp9.patch
    scandelete:
      - media/libraries
      - musikr/src/main/cpp/taglib/tests/data/
    ndk: r28c

AllowedAPKSigningKeys: fc8f9a5dd143a1b78db0bbfb779f0f9dbb19de3107fc82bfd20b1a93b30279a8

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[\d.]+$
