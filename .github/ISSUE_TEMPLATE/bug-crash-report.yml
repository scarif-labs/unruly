name: Bug/Crash Report
description: Report a problem with Shellac
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Shellac is a fork of [Auxio](https://github.com/OxygenCobalt/Auxio). If the problem also
        happens in stock Auxio, it belongs upstream, not here.
  - type: textarea
    id: desc
    attributes:
      label: Describe the bug/crash
      description: A clear description of the issue, with steps to reproduce it.
      placeholder: |
        1. Go to X
        2. Click on Y
        3. Scroll down to Z
        4. See error
    validations:
      required: true
  - type: textarea
    id: intended
    attributes:
      label: Describe the intended behavior
      placeholder: Should do X.
    validations:
      required: true
  - type: dropdown
    id: skin
    attributes:
      label: Which skin was active?
      description: Most UI problems are skin problems. If it happens in every skin, say so.
      options:
        - Touch Wheel
        - Zune
        - Happens in every skin
        - Not applicable (playback, indexing, or app-native settings)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Shellac version
      placeholder: e.g. 4.1.5, or a commit hash if you built it yourself
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: e.g. Pixel 6a, Android 15
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logcat or stack trace
      description: If you have one. Longer is better.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else
