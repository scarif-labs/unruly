name: Feature Request
description: Propose new functionality for Shellac
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: Shellac draws a hard line between the **engine** (playback and indexing,
        inherited from Auxio and deliberately untouched) and **skins**, which own every screen
        and the navigation between them. Most interface requests are skin requests — and adding
        a new skin is the intended way to get the interface you want.
  - type: textarea
    id: desc
    attributes:
      label: Description
      description: A clear description of the feature.
      placeholder: I want...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Where does this belong?
      options:
        - A skin (how a screen looks or behaves)
        - The skin contract (skins need data or a command the engine does not expose)
        - The engine or app-native settings
        - Not sure
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
