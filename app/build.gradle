import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id "com.android.application"
    id "kotlin-parcelize"
    id "dagger.hilt.android.plugin"
    id "com.google.devtools.ksp"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    // Unruly implicitly depends on the native modules, explicitly specify it
    // here so the libraries are still stripped.
    ndkVersion ndk_version
    namespace "com.merklegroot.unruly"

    defaultConfig {
        // Published package identity for the Unruly app.
        applicationId "com.scarif.unruly"
        versionName "1.0.0"
        versionCode 1

        minSdk min_sdk
        // randomly flickers between deprecated and required depending on what mood my gradle is in
        // keep it for safety
        compileSdk target_sdk
        targetSdk target_sdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-DEBUG"
        }

        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"

            dependenciesInfo {
                includeInApk = false
                includeInBundle = false
            }
        }
    }

    packagingOptions {
        jniLibs {
            excludes += ['**/kotlin/**', '**/okhttp3/**']
        }
        resources {
            excludes += ['DebugProbesKt.bin', 'kotlin-tooling-metadata.json', '**/kotlin/**', '**/okhttp3/**', 'META-INF/*.version']
        }
    }

    sourceSets {
        // The web-skin bridge's JS half lives with the skin-authoring kit, so the browser preview
        // and the app run the very same file. Only that one directory is packaged.
        main.assets.srcDirs += ['../skills/create-unruly-skin/runtime']
    }

    buildFeatures {
        buildConfig true
        compose true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
        freeCompilerArgs.add("-jvm-default=enable")
        freeCompilerArgs.add("-Xannotation-default-target=param-property")
    }
}

dependencies {
    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlin_coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-guava:$kotlin_coroutines_version"

    // --- UNRULY ---
    // The skin contract. :skin does NOT depend back on :app, so skins cannot see Unruly types.
    implementation project(":skin")

    // --- UNRULY: COMPOSE SKIN LAYER ---
    // The BOM pins every androidx.compose.* version, so those are declared without one.
    implementation platform("androidx.compose:compose-bom:$compose_bom_version")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.runtime:runtime"
    implementation "androidx.activity:activity-compose:$activity_compose_version"
    // Web skins (user-loadable): WebViewAssetLoader, origin-scoped message listener and start script.
    implementation "androidx.webkit:webkit:1.14.0"
    // collectAsStateWithLifecycle - required for lifecycle-aware StateFlow collection
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$lifecycle_compose_version"
    // Pinned explicitly: something (activity-compose / material3) pulls 2.11.0 transitively,
    // which demands compileSdk 37.
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycle_compose_version"

    // --- SUPPORT ---

    // General
    implementation "androidx.core:core-ktx:$core_version"
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.activity:activity-ktx:1.13.0"

    // Lifecycle
    def lifecycle_version = "2.10.0"
    implementation "androidx.lifecycle:lifecycle-common:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"

    // Media
    implementation "androidx.media:media:1.8.0"

    // Android Auto
    implementation "androidx.car.app:app:1.7.0"

    // Database
    implementation "androidx.room:room-runtime:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    // Build
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:$desugaring_version"

    // --- SECOND PARTY ---

    // Musikr
    implementation project(":musikr")

    // --- THIRD PARTY ---

    // Exoplayer (Vendored)
    implementation project(":media-lib-exoplayer")
    implementation project(":media-lib-decoder-ffmpeg")

    // Image loading
    implementation 'io.coil-kt.coil3:coil-core:3.4.0'

    // Material
    // TODO: Exactly figure out the conditions that the 1.7.0 ripple bug occurred so you can just
    //  PR a fix.
    implementation "com.google.android.material:material:1.14.0-alpha10"

    // Dependency Injection
    implementation "com.google.dagger:dagger:$hilt_version"
    ksp "com.google.dagger:dagger-compiler:$hilt_version"
    implementation "com.google.dagger:hilt-android:$hilt_version"
    ksp "com.google.dagger:hilt-android-compiler:$hilt_version"

    // Logging
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // Tasker integration
    implementation 'com.joaomgcd:taskerpluginlibrary:0.4.10'

    // Fuzzy search
    implementation 'org.apache.commons:commons-text:1.15.0'
}
