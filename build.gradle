buildscript {
    ext {
        agp_version = '9.2.1'
        kotlin_version = '2.3.10'
        kotlin_coroutines_version = '1.10.2'
        navigation_version = "2.9.7"
        hilt_version = '2.59.2'
        room_version = '2.8.4'
        core_version = '1.18.0'
        desugaring_version = '2.1.3'

        // Unruly: Compose skin layer. BOM pins all androidx.compose.* artifact versions,
        // so those are deliberately declared without versions below.
        compose_bom_version = '2026.06.01'
        activity_compose_version = '1.13.0'
        // verified minCompileSdk=35 via aar-metadata.properties, so safe on compileSdk 36
        paging_version = '3.5.0'
        // MUST match the coil-core version in app/build.gradle - two Coil versions in one
        // APK means two image caches and duplicate-class risk.
        coil_version = '3.4.0'
        // NOT 2.11.0: that release requires compileSdk 37 (checkDebugAarMetadata fails),
        // and the project is on 36. 2.10.0 declares minCompileSdk=35. Revisit only if the
        // whole project moves to compileSdk 37.
        lifecycle_compose_version = '2.10.0'

        min_sdk = 24
        target_sdk = 36
        ndk_version = "28.2.13676358"

    }

    dependencies {
        // Hilt isn't compatible with the new plugin syntax yet.
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"
        classpath "org.jetbrains.dokka:dokka-gradle-plugin:2.2.0"
    }
}

plugins {
    // Android studio doesn't understand this syntax
    //noinspection GradlePluginVersion
    id "com.android.application" version "$agp_version" apply false
    id "androidx.navigation.safeargs.kotlin" version "$navigation_version" apply false
    //noinspection GradlePluginVersion
    id 'com.android.library' version "$agp_version" apply false
    id "org.jetbrains.kotlin.plugin.parcelize" version "$kotlin_version" apply false
    // Unruly: required from Kotlin 2.0+; the Compose compiler ships with Kotlin, so this
    // version must always track kotlin_version exactly.
    id "org.jetbrains.kotlin.plugin.compose" version "$kotlin_version" apply false
    id "com.google.devtools.ksp" version '2.3.6' apply false
    // We use spotless in the root build.gradle to apply to all modules.
    id "com.diffplug.spotless" version "8.4.0" apply true
}

spotless {
    // Unruly's own code: the host and the skin layer. Carries the Unruly header in NOTICE.
    kotlin {
        target "app/src/**/*.kt", "skin/src/**/*.kt"
        ktfmt().kotlinlangStyle()
        licenseHeaderFile("NOTICE")
    }

    // musikr is Auxio's indexer, vendored unmodified, and keeps Auxio's copyright header
    // (musikr/NOTICE). Formatting is still enforced, but never the attribution - rewriting
    // upstream headers to say "Unruly Project" would misattribute someone else's GPL code.
    format("musikrKotlin", com.diffplug.gradle.spotless.KotlinExtension) {
        target "musikr/src/**/*.kt"
        ktfmt().kotlinlangStyle()
        licenseHeaderFile("musikr/NOTICE")
    }

    cpp {
        target("*/src/**/cpp/*.cpp", "*/src/**/cpp/*.h", "*/src/**/cpp/*.hpp")
        eclipseCdt().configFile("eclipse-cdt.xml")
        licenseHeaderFile("musikr/NOTICE")
    }
}
